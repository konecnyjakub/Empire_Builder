# wmllint: no translatables

#define CALCULATE_GOLD_INCOME
    {VARIABLE gold_income 0}
    [store_unit]
        [filter]
            side=$side_number
            ability_type=produces_gold
        [/filter]
        variable=buildings
    [/store_unit]
    [if]
        [variable]
            name=buildings.length
            greater_than=0
        [/variable]
        [then]
            [foreach]
                array=buildings
                [do]
                    [set_variable]
                        name=required_technology
                        to_variable=this_item.abilities.produces_gold.technology
                    [/set_variable]
                    [if]
                        [variable]
                            name=required_technology
                            not_equals=$eb_always_empty
                        [/variable]
                        [variable]
                            name=player_technologies[$side_number].$required_technology
                            equals=yes
                        [/variable]
                        [then]
                            {VARIABLE_OP gold_income add $this_item.abilities.produces_gold.max_value}
                        [/then]
                        [else]
                            {VARIABLE_OP gold_income add $this_item.abilities.produces_gold.value}
                        [/else]
                    [/if]
                    {CLEAR_VARIABLE required_technology}
                [/do]
            [/foreach]
        [/then]
    [/if]
    [if]
        [variable]
            name=player_technologies[$side_number].trading_routes
            equals=yes
        [/variable]
        [then]
            [store_locations]
                terrain=Re,Rr,Rrc,Rp
                #[filter]
                #race=buildings,ship
                #side=$side_number
                #[filter_location]
                #radius=2
                #[/filter_location]
                #[/filter]
                variable=roads
            [/store_locations]
            {FOREACH roads i}
                [if]
                    [have_unit]
                        race=buildings,ship
                        side=$side_number
                        [filter_location]
                            x,y=$roads[$i].x,$roads[$i].y
                            radius=2
                        [/filter_location]
                    [/have_unit]
                    [else]
                        {CLEAR_VARIABLE roads[$i]}
                        {VARIABLE_OP i sub 1}
                    [/else]
                [/if]
            {NEXT i}
            [set_variable]
                name=roads_income
                to_variable=roads.length
            [/set_variable]
            [set_variable]
                name=roads_income
                divide=5
                round=floor
            [/set_variable]
            [if]
                [variable]
                    name=roads_income
                    greater_than=0
                [/variable]
                [then]
                    {VARIABLE_OP gold_income add $roads_income}
                [/then]
            [/if]
        [/then]
    [/if]
    {CLEAR_VARIABLE buildings,roads,roads_income}
#enddef

#define CALCULATE_GOLD_EXPENSES
    {VARIABLE gold_expenses 0}
    [store_unit]
        [filter]
            side=$side_number
            canrecruit=no
            [not]
                race=buildings,ship
            [/not]
        [/filter]
        variable=side_units
    [/store_unit]
    {FOREACH side_units i}
        [if]
            [variable]
                name=side_unit[$i].variables.hero
                not_equals=yes
            [/variable]
            [then]
                {VARIABLE_OP gold_expenses add $side_units[$i].level}
            [/then]
        [/if]
    {NEXT i}
    {CLEAR_VARIABLE side_units}
#enddef

